services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: budgetsandsubscriptions
      POSTGRES_PASSWORD: budgetsandsubscriptions
      POSTGRES_DB: budgetsandsubscriptions
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetsandsubscriptions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
